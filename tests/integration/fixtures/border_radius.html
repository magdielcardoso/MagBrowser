<!DOCTYPE html>
<html>
  <head><title>border radius</title></head>
  <body style="margin:0;background:white">
    <!-- A solid red square with fully rounded corners on an opaque white
         canvas. Anti-aliased corners must produce blended (intermediate)
         colours along each arc; square corners produce only red + white. -->
    <div id="card" style="width:80px;height:80px;background:red;border-radius:20px"></div>
  </body>
</html>
