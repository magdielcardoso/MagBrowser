<!DOCTYPE html>
<html>
  <head><title>flex wrap</title></head>
  <body style="margin:0">
    <!-- Three 40px items in a 100px container: only two fit per line, so the
         third item must wrap onto a second line (a different y position). -->
    <div id="row" style="display:flex;flex-wrap:wrap;width:100px">
      <div id="a" style="width:40px;height:20px;background:red"></div>
      <div id="b" style="width:40px;height:20px;background:green"></div>
      <div id="c" style="width:40px;height:20px;background:blue"></div>
    </div>
  </body>
</html>
