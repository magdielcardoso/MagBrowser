<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background-color: #ffffff; color: #000000; font-size: 16px; }
  .box { width: 120px; height: 40px; background-color: #3366ff; border: 2px solid #000000; }
  .row { display: flex; gap: 10px; }
  .right { float: right; width: 60px; height: 30px; background-color: #ff0000; }
  .grid { display: grid; grid-template-columns: 50px 1fr; gap: 6px; }
</style>
</head>
<body>
  <div class="box"></div>
  <div class="row">
    <div class="box"></div>
    <div class="box"></div>
  </div>
  <span class="right"></span>
  <p>golden</p>
  <div class="grid">
    <span>a</span><span>b</span>
    <span>c</span><span>d</span>
  </div>
</body>
</html>
